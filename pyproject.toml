[project]
name = "explainable-data-agent"
version = "0.1.0"
description = "Contract-driven multimodal data question answering agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.13,<3",
    "langgraph==1.2.12",
    "SQLAlchemy==2.0.54",
    "sqlglot==27.29.0",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1",
]
